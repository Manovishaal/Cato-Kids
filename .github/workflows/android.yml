name: Build Cato Kids APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Inject backend credentials
        run: |
          {
            echo "CATO_SUPABASE_URL=${{ secrets.CATO_SUPABASE_URL || vars.CATO_SUPABASE_URL }}"
            echo "CATO_SUPABASE_ANON_KEY=${{ secrets.CATO_SUPABASE_ANON_KEY || vars.CATO_SUPABASE_ANON_KEY }}"
          } >> local.properties
        continue-on-error: true

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: cato-kids-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Publish release APK to a public download link
        # Only on a real push to main/master (not on PRs), so every merge keeps the
        # "latest" GitHub Release — and the stable download URL it exposes — current:
        #   https://github.com/<owner>/<repo>/releases/latest/download/app-release.apk
        # No extra secrets needed: the job-level GITHUB_TOKEN above is enough to publish a release.
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: Automatically published from ${{ github.sha }}. Signed with the debug key; installs directly, no extra signing needed.
          make_latest: true
          files: app/build/outputs/apk/release/app-release.apk
